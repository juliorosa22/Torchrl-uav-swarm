# REMOTE profile -- long training/eval runs on the lab GPU (RTX A4000, 16GB) via
# remote_run.sh. Only the hardware-scaling parameters differ from
# torchrl_mappo_cfg_local.yaml (num_envs, frames_per_batch, batch_size,
# checkpoint_interval); controller/model/algorithm hyperparameters are identical so
# results stay comparable between a local smoke test and the real run. Not the safe
# default for --config -- pass this explicitly (num_envs=256 would be too much for the
# 6GB laptop GPU).
seed: 42

# Environment
# Baseline-TorchRL-UAVSwarm-Direct-v0: obs=28  action=4  state=140 (5 agents x 28)
# FullTask-TorchRL-UAVSwarm-Direct-v0: obs=32  action=4  state=160 (5 agents x 32)
#
# GPU memory budget (16 GB card):
#   Isaac Sim PhysX scales ~linearly with num_envs * num_drones (same rate as the local
#   profile's own comment: 256 envs x 5 drones = 1280 articulations ~ 5.0 GB PhysX).
#   That leaves ~11 GB for PyTorch -- was flagged OOM-risk on the 6GB local card at this
#   same num_envs, but comfortable headroom here. Not pushed further than 256 without a
#   fresh validation pass (see torchrl_mappo_cfg_local.yaml's num_envs=64 comment for the
#   same linear-scaling math this extrapolates from).
#   GAE critic peak: (frames_per_batch/num_envs) * num_envs * n_agents * hidden[0] * 4 bytes
#     = 128 * 256 * 5 * 256 * 4 ≈ 167 MB (well within budget)
env:
  num_envs: 256
  device: cuda:0
  centralized_critic: true

# Low-level controller (applied inside the env, not the policy) -- identical to local.
# type: geometric | pd_velocity | direct
# geometric: SE(3) controller — policy outputs [vx_b, vy_b, vz_b, yaw_rate] in [-1,1]
# direct:    original raw force/torque mapping (backward compat)
controller:
  type: geometric
  max_lin_vel_cmd: 1.5    # m/s per axis
  max_yaw_rate_cmd: 1.0   # rad/s
  Kv: 2.0                 # outer-loop velocity P-gain
  # Inner-loop gains are sized for Crazyflie: moment_scale=0.01 Nm, max eR≈pi/2.
  # KR * (pi/2) ≈ 0.003 Nm — proportional across full attitude range.
  # KOmega * 20 rad/s ≈ 0.01 Nm — proportional across max angular rate.
  KR: 0.002               # inner-loop attitude P-gain
  KOmega: 0.0005          # inner-loop angular velocity D-gain

# Model architectures -- identical to local (network size is not a hardware-scaling knob
# here; changing it would change what's being trained, not just how fast).
models:
  policy:
    hidden_sizes: [128, 64]
    activation: relu
    clip_actions: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0

  critic:
    # Input: centralized state — 140 dims (Baseline) or 160 dims (FullTask)
    # 140→128 first projection avoids bottleneck; aligns with MAPPO paper's [64,64] scale.
    hidden_sizes: [128, 64]
    activation: relu

# MAPPO algorithm
algorithm:
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_loss_coef: 1.0
  entropy_coef: 0.01
  n_epochs: 5
  # 4x local's 512, matching the 4x rollout data volume so the number of minibatches per
  # epoch stays the same (163840 transitions / 2048 = 80, same as local's 40960/512=80)
  # -- same number of gradient steps per epoch, just more parallel envs feeding each one.
  batch_size: 2048
  frames_per_batch: 32768   # 256 envs x 128 steps per rollout (~2.5s sim time, same
                             # per-env horizon as local's 64 envs x 128 steps)
                             # buffer after flatten: 32768 * 5 agents = 163840 transitions
  max_grad_norm: 1.0

  # Standard PPO early-stopping (Spinning Up/CleanRL default range): once an iteration's
  # epoch-mean approximate KL exceeds this, stop taking further gradient steps that
  # iteration rather than blindly running the full n_epochs. Added as a direct guard on
  # the ACTOR side -- every other stability mechanism here (clip_value, Huber critic
  # loss, skip-on-non-finite) targets the critic or runs after loss computation; this is
  # the first one that curbs a runaway policy update before it happens. See
  # MAPPO.__init__'s target_kl docstring and the swarmgravity-rm-paper memory for the
  # investigation that motivated it.
  target_kl: 0.02

  # Batch-level advantage normalization (ClipPPOLoss's normalize_advantage kwarg).
  normalize_advantages: true
  # Reward normalization (running discounted-return std, OpenAI Baselines/CleanRL-style),
  # applied in MAPPO._normalize_rewards_inplace before GAE runs. This is what actually
  # implements the intent behind "normalize values" here -- it stabilizes the critic's
  # target scale without needing a separate raw/normalized critic-output split (PopArt),
  # since GAE bootstraps on the same normalized reward scale throughout. Confirmed
  # necessary: without it, Loss/Value grew ~1000x (2.4k -> 2.27M) over 100 iterations.
  normalize_rewards: true
  # Running per-dimension mean/std on the 28-dim obs vector (IsaacLabTorchRLWrapper's
  # obs_rms), separate from and complementary to the reward normalization above -- that one
  # stabilizes the critic's *target* scale, this one stabilizes the *input* scale the
  # actor/critic networks actually condition on. Backed by rsl_rl.networks.normalization.
  # EmpiricalNormalization (the same tool Isaac Lab's own official RL tasks use), NOT a
  # hand-rolled Welford/SB3-VecNormalize-style normalizer -- a from-scratch implementation
  # (eps=1e-8, clip=+-10, mathematically identical to VecNormalize's defaults) reliably
  # produced NaN robot velocities by the 2nd training iteration on this task: lin_vel/
  # ang_vel are reset to exactly [0,0,0] for every robot, so those channels start with
  # *exactly zero* true variance, and dividing by a near-zero std turned tiny real velocity
  # fluctuations into saturated +/-clip signals the (untrained) policy reacted to with
  # oversized actions. Neither a variance floor nor a sample-count warm-up gate fixed it.
  # EmpiricalNormalization's std+eps divisor (eps=1e-2, smaller-magnitude floor than what
  # already failed) and lack of clipping reliably avoided the failure in side-by-side
  # testing -- clipping is the leading suspect for the actual difference, since the eps
  # alone was not more conservative. Off by default (opt-in, like stage6_simple_reward) so
  # it doesn't silently change behavior for eval/play against checkpoints trained without
  # it; enable explicitly with --normalize_obs.
  normalize_observations: false

# Training run
training:
  total_frames: 5000000      # same target as local; ~153 iterations at 32768 frames/batch
                              # (vs local's ~610 iterations at 8192/batch for the same total)
  # 12 iterations * 32768 frames/batch ≈ 393k frames between checkpoints, matching local's
  # 50 * 8192 = 409.6k-frame checkpoint spacing (kept in frame-space, not iteration count,
  # since an iteration means 4x more frames here).
  checkpoint_interval: 12
  # log_interval/eval_interval are currently unused -- no code reads them (logging happens
  # every iteration unconditionally; there's no periodic eval-during-training loop yet).
  log_interval: 100
  eval_interval: 5000

  # Base folder under logs/torchrl/ shared by every run of this experiment; each run gets
  # its own timestamped subdir inside it (see mappo_train.py). Override with
  # --experiment_directory; task-agnostic by design since this value doesn't change per task.
  experiment_directory: "mappo_uav_swarm"
